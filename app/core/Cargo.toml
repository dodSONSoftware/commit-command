[package]
name = "gitfleet-core"
version = "0.1.1"
edition = "2021"
license = "MIT"
description = "Headless, experimental GitFleet controlled commit engine and disposable Git lab"

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[[bin]]
name = "gitfleet-cli"
path = "src/bin/gitfleet_cli.rs"

[[bin]]
name = "gitfleet-lab"
path = "src/bin/gitfleet_lab.rs"
