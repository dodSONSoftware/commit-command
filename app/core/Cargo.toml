[package]
name = "gitfleet-core"
version = "0.1.1"
edition = "2021"
rust-version = "1.99"
license = "MIT"
description = "Headless GitFleet inspection, controlled-write services and disposable Git lab"

[features]
default = []
# Disposable fixtures only. This does not enable production-authorized writes.
experimental-writes = []
controlled-writes = ["rusqlite/backup", "dep:sha1"]
# Disposable fault/crash driver, never exposed by the ordinary CLI.
write-test-support = ["controlled-writes"]
# Transport-neutral desktop orchestration, monitoring and JSON contracts.
application-services = ["controlled-writes", "rusqlite/serialize", "dep:notify", "dep:schemars", "dep:url", "dep:zip"]

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "0.8.23"
rusqlite = { version = "=0.41.0", default-features = false, features = ["bundled"] }
uuid = { version = "1.29.0", features = ["v4"] }
glob = "0.3.4"
sha2 = "0.10.9"
semver = "=1.0.28"
sha1 = { version = "0.10.7", optional = true }
notify = { version = "8.2.1", optional = true }
schemars = { version = "1.2.3", optional = true }
url = { version = "2.5.8", optional = true }
# Exact version: bounded preflight uses the crate's unstable streaming entry API.
zip = { version = "=9.4.2", default-features = false, optional = true }

[target.'cfg(unix)'.dependencies]
libc = "0.2.191"

[[bin]]
name = "gitfleet-cli"
path = "src/bin/gitfleet_cli.rs"

[[bin]]
name = "gitfleet-lab"
path = "src/bin/gitfleet_lab.rs"
required-features = ["experimental-writes"]

[[test]]
name = "acceptance"
required-features = ["experimental-writes"]

[[test]]
name = "core_behaviour"
required-features = ["experimental-writes"]

[[test]]
name = "write_regressions"
required-features = ["experimental-writes"]

[[bin]]
name = "gitfleet-write"
path = "src/bin/gitfleet_write.rs"
required-features = ["controlled-writes"]

[[test]]
name = "m2_writes"
required-features = ["controlled-writes"]

[[bin]]
name = "gitfleet-contracts"
path = "src/bin/gitfleet_contracts.rs"
required-features = ["application-services"]

[[test]]
name = "m3_application"
required-features = ["application-services"]

[[test]]
name = "bulk_application"
required-features = ["application-services"]

[[test]]
name = "remote_inspection"
required-features = ["application-services"]

[[test]]
name = "remote_observation"
required-features = ["application-services"]

[[bin]]
name = "gitfleet-credential"
path = "src/bin/gitfleet_credential.rs"
required-features = ["application-services"]

[[test]]
name = "version_actions"
required-features = ["application-services"]
