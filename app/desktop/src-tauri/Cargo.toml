[package]
name = "gitfleet-desktop"
version = "0.1.1"
edition = "2021"
rust-version = "1.99"
license = "MIT"
[features]
default = ["custom-protocol"]
custom-protocol = ["tauri/custom-protocol"]
# Remains non-default until native approval/accessibility acceptance is completed.
desktop-writes = []
[dependencies]
gitfleet-core = { path = "../../core", features = ["application-services"] }
tauri = { version = "=2.12.5", features = [] }
rfd = "=0.15.4"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
uuid = { version = "1", features = ["v4"] }
[build-dependencies]
tauri-build = "=2.7.4"
[profile.release]
strip = true

[dev-dependencies]
tauri = { version = "=2.12.5", features = ["test"] }
