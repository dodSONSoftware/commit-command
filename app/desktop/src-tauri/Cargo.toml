[package]
name = "gitfleet-desktop"
version = "0.1.1"
edition = "2021"
rust-version = "1.99"
license = "MIT"
[features]
default = ["custom-protocol", "desktop-writes"]
custom-protocol = ["tauri/custom-protocol"]
desktop-writes = []
# Fixed native acceptance actions; startup refuses non-fixture state. Never default.
native-acceptance-support = ["gitfleet-core/write-test-support"]
[dependencies]
gitfleet-core = { path = "../../core", features = ["application-services"] }
tauri = { version = "=2.12.5", features = [] }
rfd = "=0.15.4"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
uuid = { version = "1", features = ["v4"] }
[target.'cfg(target_os = "macos")'.dependencies]
# Native Keychain dictionaries; already cached pinned platform dependencies.
core-foundation = "=0.10.1"
security-framework-sys = { version = "=2.17.0", default-features = false }
block2 = "=0.6.2"
# Native delegate interception and opt-in WebKit test support use the pinned runtime.
objc2 = "=0.6.5"
# Native secure-field strings/geometry and test-only run-loop scheduling; already locked transitively.
objc2-foundation = { version = "=0.3.2", default-features = false, features = ["std", "NSArray", "NSString", "NSURL", "NSRunLoop", "NSObjCRuntime", "NSGeometry"] }
# Already used transitively by Tauri/rfd; explicit access is needed to cancel a sheet.
objc2-app-kit = { version = "=0.3.2", default-features = false, features = ["std", "NSWindow", "NSWorkspace", "NSApplication", "NSResponder", "NSAlert", "NSSecureTextField", "NSTextField", "NSControl", "NSView"] }
[build-dependencies]
tauri-build = "=2.7.4"
[profile.release]
strip = true

[dev-dependencies]
tauri = { version = "=2.12.5", features = ["test"] }

[target.'cfg(target_os = "macos")'.dev-dependencies]
# Create only a private disposable Keychain for adapter tests.
security-framework = { version = "=3.7.0", default-features = false }
