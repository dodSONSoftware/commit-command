name: Rust core safety and controlled-write gates
on:
  push:
    paths: ['app/core/**', 'app/desktop/**', 'docs/**', '.github/workflows/core.yml']
  pull_request:
    paths: ['app/core/**', 'app/desktop/**', 'docs/**', '.github/workflows/core.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  core:
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.99.1
        with:
          components: rustfmt, clippy
      - name: Provision Linux Git build dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential libcurl4-openssl-dev libssl-dev zlib1g-dev libexpat1-dev
      - name: Provision checksum-pinned Git 2.56
        run: python3 app/core/scripts/provision-git.py --directory "$RUNNER_TEMP/gitfleet-git"
      - name: Prepare private short-path macOS fixtures
        if: runner.os == 'macOS'
        run: |
          python3 - <<'PYTHON'
          import os, uuid
          from pathlib import Path
          identity = uuid.uuid4().hex[:12]
          directory = Path(os.environ["RUNNER_TEMP"]) / ("gitfleet-fixtures-" + identity)
          directory.mkdir(mode=0o700)
          alias = Path("/private/tmp") / ("gf-" + identity)
          alias.symlink_to(directory.resolve())
          with open(os.environ["GITHUB_ENV"], "a") as output:
              output.write("TMPDIR=" + str(alias) + "\n")
          PYTHON
      - name: Provision isolated-fixture OpenPGP signer on macOS
        if: runner.os == 'macOS'
        run: |
          brew install gnupg
          echo "$(brew --prefix gnupg)/bin" >> "$GITHUB_PATH"
          echo "GITFLEET_TEST_GPG=$(brew --prefix gnupg)/bin/gpg" >> "$GITHUB_ENV"
      - name: Validate default inspection, experimental lab and supported M2/M3 Core gates
        run: sh app/core/scripts/validate.sh
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: core-evidence-${{ matrix.os }}
          path: app/core/target/m3-evidence/

  desktop:
    runs-on: macos-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.99.1
        with:
          components: rustfmt, clippy
      - name: Provision checksum-pinned Git 2.56
        run: python3 app/core/scripts/provision-git.py --directory "$RUNNER_TEMP/gitfleet-git"
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: app/desktop/package-lock.json
      - run: npm --prefix app/desktop ci
      - name: Automated desktop gates; native human acceptance remains separate
        run: sh app/desktop/scripts/validate.sh
